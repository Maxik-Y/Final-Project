<!DOCTYPE html>
<html>
<head>
    <title>Історія покупок</title>
    <style>
        body { font-family: sans-serif; margin: 20px; }
        table { border-collapse: collapse; margin-top: 15px; }
        th, td { border: 2px solid #414040; padding: 8px; text-align: left; }
    </style>
</head>
<body>
    <div style="float: right;">
        <a href="/">Назад до магазину</a>
    </div>

    <h3>Ваша історія покупок</h3>
    
    <table>
        <thead>
            <tr>
                <th>Дата та час</th>
                <th>Назва товару</th>
                <th>Кількість</th>
            </tr>
        </thead>
        <tbody>
            {% for item in history %}
            <tr>
                    <td>{{ item.time_stamp }}</td>
                    <td>{{ item.product_name }}</td>
                    <td>{{ item.quantity }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
